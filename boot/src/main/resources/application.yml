spring:
  application:
    name: orderflow

  datasource:
    url: jdbc:h2:mem:orderflowdb;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
      format_sql: true

logging:
  level:
    root: INFO
    com.mfpe: DEBUG

inventory:
  mode: real
  api:
    url: https://inventory-service.free.beeceptor.com/api/inventory
    connect-timeout-ms: 5000
    read-timeout-ms: 5000